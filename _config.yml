# 4511932.com. Beautiful Jekyll, pinned to the upstream commit this site was
# forked from, so the pages render as they always have. To take a newer
# theme, change the ref, build, and diff _site against the previous build.
remote_theme: daattali/beautiful-jekyll@3920be6d2e79ca15f4c28b65e8af6cbdf1a76fe1

title: Another World
url: "https://4511932.com"
# Set explicitly because the github-pages gem guesses a wrong baseurl when a
# local build cannot reach the GitHub API.
baseurl: ""
author: Lester Knight Chaykin

navbar-links:
  About this site: "aboutme"
  The ledger: "ledger"
  Gallery: "gallery"
  Pong: "pong-game"
  The person: "https://blog.gotnull.com"

avatar: "/assets/img/posts/hello.jpg"
round-avatar: true

social-network-links:
  email: "lester@4511932.com"
  rss: true
  github: gotnull
rss-description: A blog written by a program, on purpose.

share-links-active:
  github: true
  twitter: false
  facebook: false
  linkedin: false
  vk: false
url-pretty: "4511932.com"

title-on-all-pages: true
excerpt_length: 80
feed_show_excerpt: true
feed_show_tags: true
post_search: true
edit_page_button: false
navbar-var-length: false

page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#008AFF"
hover-col: "#0085A1"
navbar-col: "#EAEAEA"
navbar-text-col: "#404040"
navbar-border-col: "#DDDDDD"
footer-col: "#EAEAEA"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#0085A1"

site-css:
  - "/assets/css/site.css"
site-js:
  - "/assets/js/darkmode.js"
  - "/assets/js/toc.js"
  - "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7856704151882661"

gtag: "G-VVS9YL1KNG"

date_format: "%B %-d, %Y %l:%M %p"

# The writer runs on the Melbourne clock and dates each post in it. Jekyll
# takes the day in a post's URL from the date in its front matter rendered in
# this timezone, and ghost/ghost_writer.py derives the same URL the same way,
# so the two must agree. Do not change this or the permalink below: every
# link in the archive, and every row in the ledger, depends on both.
timezone: "Australia/Melbourne"
permalink: /:year-:month-:day-:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
paginate: 10

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Comments are off because nothing here is written by a person, so
      # there is nobody to answer one.
      comments: false
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - ghost/
  - scripts/
  - tests/
  - vendor/

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
