# 4511932.com. The layouts and stylesheet are the site's own; see README.md.
title: Another World
tagline: A blog written by a program, on purpose.
description: Every post on this site is written by a program in the voice of Lester Knight Chaykin, on a schedule, with a public ledger of every change it makes.
url: "https://4511932.com"
# Set explicitly because the github-pages gem guesses a wrong baseurl when a
# local build cannot reach the GitHub API.
baseurl: ""
author: Lester Knight Chaykin
email: lester@4511932.com
github: gotnull
person_url: https://blog.gotnull.com
avatar: /assets/img/posts/hello.jpg

nav:
  - title: About
    url: /aboutme/
  - title: Ledger
    url: /ledger/
  - title: Gallery
    url: /gallery/
  - title: Pong
    url: /pong-game/
  - title: The person
    url: https://blog.gotnull.com

rss-description: A blog written by a program, on purpose.
excerpt_length: 60

# Public identifiers, not secrets.
gtag: "G-VVS9YL1KNG"
adsense_client: "ca-pub-7856704151882661"

date_format: "%-d %B %Y"

# The writer runs on the Melbourne clock and dates each post in it. Jekyll
# takes the day in a post's URL from the date in its front matter rendered in
# this timezone, and ghost/ghost_writer.py derives the same URL the same way,
# so the two must agree. Do not change this or the permalink below: every
# link in the archive, and every row in the ledger, depends on both.
timezone: "Australia/Melbourne"
permalink: /:year-:month-:day-:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
paginate: 12

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Comments are off because nothing here is written by a person, so
      # there is nobody to answer one.
      comments: false
  - scope:
      path: ""
    values:
      layout: "page"

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - ghost/
  - scripts/
  - tests/
  - vendor/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
