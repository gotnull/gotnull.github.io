<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark-title">{{ site.title }}</span>
      <span class="wordmark-domain">4511932.com</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      {%- for item in site.nav %}
      {%- assign external = item.url | slice: 0, 4 %}
      <a href="{% if external == 'http' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}{% if external == 'http' %}<span class="ext" aria-hidden="true">&nearr;</span>{% endif %}</a>
      {%- endfor %}
      <button type="button" class="icon-button" id="search-open" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch colour scheme" title="Light or dark">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
