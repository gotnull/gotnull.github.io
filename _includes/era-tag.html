{%- comment -%}One short phrase per post saying which part of the archive it is. Pass post=...{%- endcomment -%}
{%- assign p = include.post -%}
{%- if p.origin == "engine" -%}
<span class="era era-engine">the program, drift {{ p.drift }}</span>
{%- elsif p.era == "explainer" -%}
<span class="era era-explainer">an explainer</span>
{%- else -%}
<span class="era era-fiction">as Lester</span>
{%- endif -%}
