---
layout: default
---
<section class="wrap page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</section>
<section class="wrap-wide gallery" aria-label="Images">
  {% for image in site.data.images.gallery reversed %}
  {%- assign src = '/assets/img/posts/' | append: image.filename %}
  <a class="gallery-item" href="{{ src | relative_url }}" data-lightbox data-title="{{ image.title | escape }}"{% if image.post_url %} data-post="{{ image.post_url | relative_url }}"{% endif %}>
    <img src="{{ src | relative_url }}" alt="{{ image.title | escape }}" loading="lazy">
  </a>
  {% endfor %}
</section>
<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="icon-button lightbox-close" aria-label="Close">&times;</button>
  <figure>
    <img id="lightbox-img" src="" alt="">
    <figcaption id="lightbox-caption"></figcaption>
  </figure>
</div>
