# Builds the site the way GitHub Pages does, so a broken push is noticed.
# Deployment is not done here: Pages builds the master branch itself.
name: Build
on:
  push:
    paths-ignore:
      - 'assets/daily_mission/**'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build
      - name: Check the game
        run: |
          npm ci --prefix ghost --no-audit --no-fund
          node ghost/pong_check.js
      - name: Test the programs
        run: |
          pip install pyyaml pytest
          python -m pytest -q tests
