name: Write today's post

on:
  schedule:
    # 11:11pm Melbourne during AEST. The two later runs are retries: the
    # writer does nothing if a post went out in the last 12 hours.
    - cron: '11 13 * * *'
    - cron: '11 16 * * *'
    - cron: '11 19 * * *'
  workflow_dispatch:
    inputs:
      force_alter:
        description: "Force an alteration of this kind (author, marginalia, redaction, rewrite)"
        required: false

permissions:
  contents: write
  models: read   # GitHub Models, the fallback when OpenAI refuses

concurrency:
  group: ghost-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai pyyaml

      - name: Run the writer
        id: writer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOST_MODEL: ${{ vars.GHOST_MODEL || 'gpt-4o' }}
        run: |
          if [ -n "${{ github.event.inputs.force_alter }}" ]; then
            python ghost/ghost_writer.py --force-alter "${{ github.event.inputs.force_alter }}"
          else
            python ghost/ghost_writer.py
          fi

      - name: Commit
        if: steps.writer.outputs.changed != ''
        run: |
          git config user.name 'Lester Knight Chaykin'
          git config user.email 'lester@4511932.com'
          git add ${{ steps.writer.outputs.changed }}
          git commit -m "Post from the program" || echo "nothing to commit"
          git pull --rebase origin master
          git push
