name: Improve the game

on:
  schedule:
    # Half an hour after each writer run. Every run checks the published
    # game and repairs it if it fails; only the first to keep a change in a
    # day proposes one.
    - cron: '41 13 * * *'
    - cron: '41 16 * * *'
    - cron: '41 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read   # GitHub Models, the fallback when OpenAI refuses

# Same group as the writer so the two never push at the same time.
concurrency:
  group: ghost-writer
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # a broken game is restored from history

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install openai pyyaml
          npm ci --prefix ghost --no-audit --no-fund

      - name: Propose, check and keep one change
        id: improver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOST_MODEL: ${{ vars.GHOST_MODEL || 'gpt-4o' }}
        run: python ghost/pong_improver.py

      - name: Commit
        if: steps.improver.outputs.changed != ''
        run: |
          git config user.name 'Lester Knight Chaykin'
          git config user.email 'lester@4511932.com'
          git add ${{ steps.improver.outputs.changed }}
          git commit -m "Pong, from the program" || echo "nothing to commit"
          git pull --rebase origin master
          git push
